<!--Vista General Dirección-->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panel General - Dirección Preescolar</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        #ultimo {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0 30px;
            padding: 30px 20px;
            background: linear-gradient(145deg, #ffffff, #f5f7fa);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-left: 12px solid #adad00;
            line-height: 1.3;
        }
        #ultimo small {
            font-size: 1.8rem;
            color: #555;
            display: block;
            font-weight: normal;
        }
        #lista {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c3e50;
            font-weight: 400;
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.1rem;
        }
        th {
            background: #adad00;
            color: white;
            padding: 15px 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .grupo-badge {
            background-color: #2ecc71;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-block;
        }
        #audioActivador {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #adad00;
            color: white;
            padding: 15px 30px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(243,156,18,0.4);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 1000;
            border: none;
            transition: transform 0.2s;
        }
        #audioActivador:hover {
            transform: scale(1.05);
            background: #f5f51b;
        }
        .cargando {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🏫 Panel General de Salidas - Dirección Preescolar</h1>
    <div id="ultimo">
        Esperando primera salida...
        <small></small>
    </div>
    
    <div id="lista">
        <h2>📋 Últimas 20 salidas registradas</h2>
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Nombre del Alumno</th>
                    <th>Grupo</th>
                </tr>
            </thead>
            <tbody id="tabla-lista">
                <tr><td colspan="3" class="cargando">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Audio desde Google Drive (URL directa de vista) -->
    <audio id="alerta" preload="auto">
        <source src="https://www.dropbox.com/scl/fi/1lcmf5993cq1op4tcgpuc/alerta1.mp3?rlkey=oao3zb2q1z6xp5v0jo7w24c1r&st=7xo67ep3&raw=1" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Botón flotante para habilitar audio (obligatorio por políticas del navegador) -->
    <div id="audioActivador">🔈 Habilitar alertas sonoras</div>

    <script>
        // ---------- CONFIGURACIÓN ----------
        const grupo = "todos";  // NO CAMBIAR: así obtenemos todos los grupos
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyxFu756QssmDL5wptbqTL_4hEscNNjCPYPZWLXiBzsJtJT7ykhW900euJ8eQoH_Km0KQ/exec";  // <--- REEMPLAZA con tu URL real (termina en /exec)
        // ------------------------------------

        let audioHabilitado = false;
        const alertaSound = document.getElementById('alerta');
        let ultimoRegistroId = "";  // Para detectar nuevos registros

        // Función para reproducir alerta solo si está habilitado
        function reproducirAlerta() {
            if (!audioHabilitado) return;
            alertaSound.currentTime = 0;  // Reinicia por si ya estaba sonando
            alertaSound.play().catch(e => console.log('Error al reproducir (posible bloqueo):', e));
        }

        // Evento para habilitar el audio con un clic del usuario
        document.getElementById('audioActivador').addEventListener('click', function() {
            alertaSound.play().then(() => {
                audioHabilitado = true;
                this.style.display = 'none';  // Ocultar botón
                console.log('Audio habilitado correctamente');
            }).catch(e => {
                alert('Por favor, interactúa con la página (haz clic en cualquier lugar) para habilitar el sonido.');
            });
        });

        // Función para cargar datos usando JSONP (evita CORS)
        function actualizar() {
            // Eliminar script anterior si existe
            if (window.scriptTag) {
                document.head.removeChild(window.scriptTag);
            }
            // Crear nueva etiqueta script
            window.scriptTag = document.createElement('script');
            window.scriptTag.src = webAppUrl + "?grupo=" + encodeURIComponent(grupo) + "&callback=procesarDatos";
            document.head.appendChild(window.scriptTag);
        }

        // Función global que llama el JSONP
        window.procesarDatos = function(data) {
            console.log('Datos recibidos (dirección):', data);

            if (data.error) {
                document.getElementById('ultimo').innerHTML = `<span style="color:#e74c3c;">Error: ${data.error}</span>`;
                return;
            }

            // Mostrar el último alumno (si existe)
            const ultimoDiv = document.getElementById('ultimo');
            if (data.ultimo) {
                const ultimo = data.ultimo;
                ultimoDiv.innerHTML = `
                    ${ultimo.nombre}
                    <small>Grupo ${ultimo.grupoCompleto}</small>
                `;

                // Detectar si es un registro nuevo (comparando timestamp + nombre)
                const nuevoId = ultimo.timestamp + ultimo.nombre;
                if (nuevoId !== ultimoRegistroId) {
                    reproducirAlerta();
                    ultimoRegistroId = nuevoId;
                }
            } else {
                ultimoDiv.innerHTML = 'Sin registros aún <small></small>';
            }

            // Mostrar la tabla con los últimos 20 registros
            const tbody = document.getElementById('tabla-lista');
            tbody.innerHTML = '';

            if (data.lista && data.lista.length > 0) {
                data.lista.forEach(reg => {
                    // Formatear hora (timestamp viene como string desde Sheets)
                    const fecha = new Date(reg.timestamp);
                    const hora = fecha.toLocaleTimeString();
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${hora}</td>
                        <td>${reg.nombre}</td>
                        <td><span class="grupo-badge">${reg.grupoCompleto}</span></td>
                    `;
                    tbody.appendChild(fila);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px;">No hay salidas registradas</td></tr>';
            }
        };

        // Actualizar cada 1 segundo (puedes ajustar si quieres)
        setInterval(actualizar, 1000);
        actualizar();  // Primera carga inmediata
    </script>
</body>
</html>
